<!DOCTYPE html>
<html>
<head>
    <title>OTP Verification</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:350px;
            background:white;
            padding:30px;
            border-radius:12px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .otp{
            display:flex;
            justify-content:space-between;
            margin:20px 0;
        }

        .otp input{
            width:50px;
            height:50px;
            text-align:center;
            font-size:20px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            background:#4F46E5;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }
    </style>
</head>
<body>

<div class="container">

<h2>Verify OTP</h2>

<p>Enter the 4-digit code sent to your phone</p>

<div class="otp">
    <input maxlength="1">
    <input maxlength="1">
    <input maxlength="1">
    <input maxlength="1">
</div>

<button onclick="location.href='success.html'">
    Verify
</button>

<p>
    Didn't receive OTP?
    <a href="#">Resend OTP</a>
</p>

</div>

</body>
</html>
