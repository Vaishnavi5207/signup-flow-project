<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:350px;
            background:white;
            padding:30px;
            border-radius:12px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .logo{
            width:80px;
            height:80px;
            background:#4F46E5;
            border-radius:50%;
            margin:auto;
        }

        h1{
            color:#4F46E5;
        }

        .btn{
            display:block;
            width:100%;
            padding:12px;
            margin-top:15px;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
        }

        .primary{
            background:#4F46E5;
            color:white;
        }

        .secondary{
            border:2px solid #4F46E5;
            color:#4F46E5;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo"></div>

    <h1>HealthTrack</h1>

    <p>Track your health easily</p>

    <a href="signup.html" class="btn primary">Get Started</a>

    <a href="signup.html" class="btn secondary">Login</a>
</div>

</body>
</html>
