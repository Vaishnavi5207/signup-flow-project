<!DOCTYPE html>
<html>
<head>
    <title>Success</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:350px;
            background:white;
            padding:30px;
            border-radius:12px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .tick{
            width:100px;
            height:100px;
            border-radius:50%;
            background:green;
            color:white;
            font-size:60px;
            margin:auto;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#4F46E5;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }
    </style>
</head>
<body>

<div class="container">

<div class="tick">✓</div>

<h2>Account Created Successfully</h2>

<p>Your account is ready to use.</p>

<button onclick="location.href='index.html'">
    Continue
</button>

</div>

</body>
</html>
